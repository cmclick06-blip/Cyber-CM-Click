<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2342">
<title>Cyber CM Click | روابطنا</title>
<style>
:root{--navy:#0b2342;--pink:#ed1260;--rose:#fff2f7;--ink:#102b4f}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Tahoma,Arial,sans-serif;background:#fff8fb}
.page{max-width:680px;min-height:100vh;margin:auto;padding:25px 18px 34px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,#fff 0 38%,#fff7fa 74%,#ffe9f1 100%)}
.silk{position:absolute;z-index:0;pointer-events:none;filter:drop-shadow(0 10px 12px #7b123c26)}
.silk.top{top:-45px;left:-50px;width:270px;height:180px;border-radius:45% 55% 62% 38%;transform:rotate(-24deg);background:linear-gradient(145deg,#071b35 0%,#16416e 17%,#f45b99 24%,#ed1260 42%,#ffb6d1 53%,#c70d4d 68%,#fff 75%);opacity:.95}
.silk.bottom{right:-65px;bottom:-45px;width:310px;height:160px;border-radius:60% 40% 0 0;transform:rotate(-20deg);background:linear-gradient(165deg,#fff 0%,#f7a4c4 12%,#ed1260 28%,#ff72a7 45%,#a90b42 62%,#0b2342 76%,#31557a 100%)}
.content{position:relative;z-index:1}
.logo-box{display:flex;justify-content:center;align-items:center;margin:5px auto 14px;padding:10px 0}
.logo{display:block;width:min(84%,420px);height:auto;max-height:560px;object-fit:contain;border-radius:10px}
.welcome{text-align:center;font-size:clamp(28px,6vw,40px);font-weight:900;line-height:1.4;margin:8px 0 2px;color:var(--navy)}
.brand{text-align:center;color:var(--pink);font-family:Arial,Tahoma,sans-serif;font-size:clamp(26px,5.5vw,38px);font-weight:900;direction:ltr;margin:0 0 12px}
.subtitle{text-align:center;font-size:clamp(16px,3.6vw,22px);line-height:1.7;margin:0 0 23px}
.links{display:flex;flex-direction:column;gap:15px}
.link{display:flex;align-items:center;gap:14px;min-height:100px;padding:13px 17px;border-radius:999px;text-decoration:none;border:2px solid var(--pink);color:var(--navy);background:linear-gradient(115deg,#fff,#fff7fa 55%,#ffe9f2);box-shadow:0 9px 18px #9f17441b,inset 0 1px 0 #fff;transition:transform .15s}
.link:active{transform:scale(.985)}
.link.whatsapp,.link.tiktok{background:linear-gradient(120deg,#0b2342,#123b6a 65%,#071a31);color:#fff;border-color:#ed1260}
.link.facebook{background:linear-gradient(120deg,#f50d61,#ed1260 65%,#ff4d91);color:white;border-color:#ff78aa}
.icon{width:65px;height:65px;flex:0 0 65px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #ff5a98;box-shadow:0 0 0 3px #fff8fb,0 0 0 5px #ed1260;font-size:34px;font-weight:900;color:var(--navy)}
.whatsapp .icon{color:#20b760;font-size:36px} .maps .icon{font-size:38px} .facebook .icon{font-family:Arial,sans-serif;font-size:49px;color:#1877f2} .tiktok .icon{background:#050505;color:#fff;font-size:35px}
.label{flex:1;min-width:0}
.label strong{display:block;direction:ltr;text-align:right;font-family:Arial,Tahoma,sans-serif;font-size:clamp(19px,4.3vw,26px);margin-bottom:6px}
.label span{display:block;font-size:clamp(15px,3.5vw,21px);font-weight:700;line-height:1.4}
.arrow{width:43px;height:43px;flex:0 0 43px;border-radius:50%;display:grid;place-items:center;background:var(--pink);color:#fff;font:34px/1 Arial,sans-serif}
.facebook .arrow{background:#fff;color:var(--pink)}
.footer{text-align:center;color:var(--navy);font-size:17px;margin:24px auto 0;line-height:1.8}
.heart{color:var(--pink);font-size:25px;margin:0 8px}
@media(max-width:390px){.page{padding:18px 12px 28px}.logo{width:88%}.link{min-height:88px;padding:10px 12px;gap:10px}.icon{width:52px;height:52px;flex-basis:52px;font-size:28px}.arrow{width:36px;height:36px;flex-basis:36px;font-size:29px}.links{gap:12px}}
</style>
</head>
